<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>laoban 管理看板</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fafafa; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 24px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    .kind { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .kind.ai { background: #e3f2fd; color: #1565c0; }
    .kind.human { background: #e8f5e9; color: #2e7d32; }
    .src-ai_delegated { color: #1565c0; }
    .src-self { color: #616161; }
    .src-boss { color: #b71c1c; }
    #who { padding: 4px; }
    button { padding: 4px 12px; cursor: pointer; }
    .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .status.active { background: #e8f5e9; color: #2e7d32; }
    .status.suspended { background: #fff3e0; color: #e65100; }
    .status.terminated { background: #ffebee; color: #b71c1c; text-decoration: line-through; }
    .dept { margin-top: 16px; }
    .dept h3 { margin: 8px 0 4px; }
    .queue-count { background: #e3f2fd; border-radius: 10px; padding: 0 8px; font-size: 12px; }
    .msg-meta { color: #757575; font-size: 12px; }
    .empty { color: #9e9e9e; padding: 8px; }
  </style>
</head>
<body>
  <h1>laoban 管理看板</h1>

  <h2>组织架构</h2>
  <div id="org"></div>

  <h2>任务</h2>
  <table id="tasks"><thead><tr><th>ID</th><th>标题</th><th>状态</th></tr></thead><tbody></tbody></table>

  <h2>员工花名册</h2>
  <table id="employees"><thead><tr><th>ID</th><th>类别</th><th>姓名</th><th>职位</th><th>部门</th><th>状态</th></tr></thead><tbody></tbody></table>

  <h2>点对点消息</h2>
  <p>
    <input id="msgWho" placeholder="员工 id，如 dev" />
    <button onclick="loadMessages()">查看收发件箱</button>
  </p>
  <table id="msgInbox"><thead><tr><th>ID</th><th>发件人 → 收件人</th><th>内容</th></tr></thead><tbody></tbody></table>
  <table id="msgSent"><thead><tr><th>ID</th><th>发件人 → 收件人</th><th>内容</th></tr></thead><tbody></tbody></table>

  <h2>工位任务队列</h2>
  <p>
    <input id="queueWho" placeholder="员工 id，如 dev" />
    <button onclick="loadQueue()">查看队列</button>
  </p>
  <table id="queueTasks"><thead><tr><th>任务 ID</th><th>标题</th><th>状态</th></tr></thead><tbody></tbody></table>

  <h2>人类员工当日任务清单</h2>
  <p>
    <input id="who" placeholder="员工 id，如 emp-陈工" />
    <button onclick="loadHumanTasks()">查看今日清单</button>
    <button onclick="loadHumanResults()">查看回传结果</button>
  </p>
  <table id="humanTasks"><thead><tr><th>ID</th><th>标题</th><th>来源</th><th>截止</th><th>状态</th></tr></thead><tbody></tbody></table>
  <table id="humanResults"><thead><tr><th>ID</th><th>标题</th><th>承接人</th><th>回传结果</th></tr></thead><tbody></tbody></table>

  <script>
    const SRC_LABEL = { ai_delegated: 'AI 派发', self: '自建', boss: '老板指派' };
    const STATUS_LABEL = { active: '在职', suspended: '停职', terminated: '已解雇' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function kindBadge(kind) {
      return `<span class="kind ${esc(kind)}">${kind === 'human' ? '人类' : 'AI'}</span>`;
    }
    function statusBadge(status) {
      return `<span class="status ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>`;
    }

    async function load() {
      const ts = await (await fetch('/api/tasks')).json();
      document.querySelector('#tasks tbody').innerHTML = ts.map(t =>
        `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td>${esc(t.state)}</td></tr>`).join('');
      const es = await (await fetch('/api/employees')).json();
      document.querySelector('#employees tbody').innerHTML = es.map(e =>
        `<tr><td>${esc(e.id)}</td><td>${kindBadge(e.kind)}</td>` +
        `<td>${esc(e.name)}</td><td>${esc(e.title)}</td><td>${esc(e.department)}</td>` +
        `<td>${statusBadge(e.status)}</td></tr>`).join('');
      await loadOrg();
    }

    async function loadOrg() {
      const depts = await (await fetch('/api/org')).json();
      document.getElementById('org').innerHTML = depts.length ? depts.map(d =>
        `<div class="dept"><h3>${esc(d.id)}（${d.employees.length} 人）</h3>` +
        '<table><thead><tr><th>ID</th><th>类别</th><th>姓名</th><th>职位</th><th>状态</th><th>在办</th></tr></thead><tbody>' +
        d.employees.map(e =>
          `<tr><td>${esc(e.id)}</td><td>${kindBadge(e.kind)}</td><td>${esc(e.name)}</td>` +
          `<td>${esc(e.title)}</td><td>${statusBadge(e.status)}</td>` +
          `<td><span class="queue-count">${e.queue.length}</span></td></tr>`).join('') +
        '</tbody></table></div>').join('')
        : '<p class="empty">暂无员工</p>';
    }

    async function loadMessages() {
      const who = document.getElementById('msgWho').value.trim();
      if (!who) { alert('请输入员工 id'); return; }
      const data = await (await fetch(`/api/messages?who=${encodeURIComponent(who)}`)).json();
      const row = m => `<tr><td>${esc(m.id)}</td><td>${esc(m.from)} → ${esc(m.to)}` +
        (m.task_id ? `<div class="msg-meta">任务 ${esc(m.task_id)}</div>` : '') + `</td><td>${esc(m.content)}</td></tr>`;
      document.querySelector('#msgInbox tbody').innerHTML = data.inbox.length
        ? data.inbox.map(row).join('') : '<tr><td colspan="3" class="empty">收件箱为空</td></tr>';
      document.querySelector('#msgSent tbody').innerHTML = data.sent.length
        ? data.sent.map(row).join('') : '<tr><td colspan="3" class="empty">发件箱为空</td></tr>';
    }

    async function loadQueue() {
      const who = document.getElementById('queueWho').value.trim();
      if (!who) { alert('请输入员工 id'); return; }
      let data;
      try {
        data = await (await fetch(`/api/queue?who=${encodeURIComponent(who)}`)).json();
      } catch (e) {
        alert('查询失败：' + e.message); return;
      }
      document.querySelector('#queueTasks tbody').innerHTML = data.length
        ? data.map(q => `<tr><td>${esc(q.id)}</td><td>${esc(q.title)}</td><td>${esc(q.state)}</td></tr>`).join('')
        : '<tr><td colspan="3" class="empty">队列为空</td></tr>';
    }

    async function loadHumanTasks() {
      const who = document.getElementById('who').value.trim();
      if (!who) { alert('请输入员工 id'); return; }
      const date = new Date().toISOString().slice(0, 10);
      const hts = await (await fetch(`/api/human-tasks?who=${encodeURIComponent(who)}&date=${date}`)).json();
      document.querySelector('#humanTasks tbody').innerHTML = hts.length ? hts.map(h =>
        `<tr><td>${esc(h.id)}</td><td>${esc(h.title)}</td>` +
        `<td class="src-${esc(h.source)}">${esc(SRC_LABEL[h.source] || h.source)}</td>` +
        `<td>${esc(h.due_date || '不限期')}</td><td>${esc(h.status)}</td></tr>`).join('')
        : '<tr><td colspan="5">当日无待办</td></tr>';
    }

    async function loadHumanResults() {
      // 人→人闭环：查看该员工发起的任务已回传的结果
      const who = document.getElementById('who').value.trim();
      if (!who) { alert('请输入员工 id'); return; }
      const rs = await (await fetch(`/api/human-results?who=${encodeURIComponent(who)}`)).json();
      document.querySelector('#humanResults tbody').innerHTML = rs.length ? rs.map(h =>
        `<tr><td>${esc(h.id)}</td><td>${esc(h.title)}</td><td>${esc(h.assignee)}</td>` +
        `<td>${esc(h.result || '（空）')}</td></tr>`).join('')
        : '<tr><td colspan="4">暂无回传结果</td></tr>';
    }

    load();
  </script>
</body>
</html>

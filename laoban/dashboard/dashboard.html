<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>laoban 管理看板</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fafafa; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 24px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    .kind { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .kind.ai { background: #e3f2fd; color: #1565c0; }
    .kind.human { background: #e8f5e9; color: #2e7d32; }
    .src-ai_delegated { color: #1565c0; }
    .src-self { color: #616161; }
    .src-boss { color: #b71c1c; }
    #who { padding: 4px; }
    button { padding: 4px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>laoban 管理看板</h1>

  <h2>任务</h2>
  <table id="tasks"><thead><tr><th>ID</th><th>标题</th><th>状态</th></tr></thead><tbody></tbody></table>

  <h2>员工花名册</h2>
  <table id="employees"><thead><tr><th>ID</th><th>类别</th><th>姓名</th><th>职位</th><th>部门</th></tr></thead><tbody></tbody></table>

  <h2>人类员工当日任务清单</h2>
  <p>
    <input id="who" placeholder="员工 id，如 emp-陈工" />
    <button onclick="loadHumanTasks()">查看</button>
  </p>
  <table id="humanTasks"><thead><tr><th>ID</th><th>标题</th><th>来源</th><th>截止</th><th>状态</th></tr></thead><tbody></tbody></table>

  <script>
    const SRC_LABEL = { ai_delegated: 'AI 派发', self: '自建', boss: '老板指派' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function load() {
      const ts = await (await fetch('/api/tasks')).json();
      document.querySelector('#tasks tbody').innerHTML = ts.map(t =>
        `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td>${esc(t.state)}</td></tr>`).join('');
      const es = await (await fetch('/api/employees')).json();
      document.querySelector('#employees tbody').innerHTML = es.map(e =>
        `<tr><td>${esc(e.id)}</td><td><span class="kind ${esc(e.kind)}">${e.kind === 'human' ? '人类' : 'AI'}</span></td>` +
        `<td>${esc(e.name)}</td><td>${esc(e.title)}</td><td>${esc(e.department)}</td></tr>`).join('');
    }

    async function loadHumanTasks() {
      const who = document.getElementById('who').value.trim();
      if (!who) { alert('请输入员工 id'); return; }
      const date = new Date().toISOString().slice(0, 10);
      const hts = await (await fetch(`/api/human-tasks?who=${encodeURIComponent(who)}&date=${date}`)).json();
      document.querySelector('#humanTasks tbody').innerHTML = hts.length ? hts.map(h =>
        `<tr><td>${esc(h.id)}</td><td>${esc(h.title)}</td>` +
        `<td class="src-${esc(h.source)}">${esc(SRC_LABEL[h.source] || h.source)}</td>` +
        `<td>${esc(h.due_date || '不限期')}</td><td>${esc(h.status)}</td></tr>`).join('')
        : '<tr><td colspan="5">当日无待办</td></tr>';
    }

    load();
  </script>
</body>
</html>
